    <style>
        /* CSS Variables */
        :root {
            --primary: #000;
            --secondary: #fff;
            --accent: #ff3b00;
            --font-stack: Impact, system-ui, sans-serif;
            --gap: 48px;
            --section-padding: 72px;
            --section-gap: 120px;
            --border-width: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            background: var(--primary);
        }

        body {
            font-family: var(--font-stack);
            color: var(--secondary);
            background: var(--primary);
            line-height: 1.2;
            -webkit-font-smoothing: antialiased;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-stack);
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        h1 {
            font-size: clamp(3.5rem, 12vw, 8rem);
            line-height: 0.9;
            color: var(--secondary);
        }

        h2 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            line-height: 1;
            color: var(--accent);
        }

        h3 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            line-height: 1.1;
        }

        p, li, blockquote, address {
            font-family: var(--font-stack);
            font-size: 1.2rem;
            margin-bottom: 0.5em;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s;
        }

        a:hover {
            border-bottom-color: var(--accent);
        }

        /* Utility Classes */
        .container {
            padding: 0 var(--section-padding);
            max-width: 100%;
        }

        .section {
            padding: var(--section-padding) 0;
            margin-bottom: var(--section-gap);
        }

        .full-bleed {
            margin-left: calc(-1 * var(--section-padding));
            margin-right: calc(-1 * var(--section-padding));
            padding-left: var(--section-padding);
            padding-right: var(--section-padding);
        }

        /* Brutalist Base */
        .brutal-border {
            border: var(--border-width) solid var(--secondary);
            box-shadow: 8px 8px 0 var(--accent);
        }

        .brutal-border-accent {
            border: var(--border-width) solid var(--accent);
            box-shadow: 8px 8px 0 var(--secondary);
        }

        .skew-element {
            transform: skew(-5deg);
            display: inline-block;
        }

        .rotate-element {
            transform: rotate(-3deg);
        }

        .noise-bg {
            background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,59,0,0.03) 2px, rgba(255,59,0,0.03) 4px);
        }

        /* ----- Header & Nav ----- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--primary);
            border-bottom: var(--border-width) solid var(--accent);
            padding: 24px var(--section-padding);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2.5rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: -0.03em;
            border: none;
        }

        .logo span {
            color: var(--secondary);
        }

        .nav-links {
            display: flex;
            gap: var(--gap);
            list-style: none;
            align-items: center;
        }

        .nav-links li a {
            font-size: 1.4rem;
            color: var(--secondary);
            text-transform: uppercase;
            border-bottom: 2px solid transparent;
            padding-bottom: 4px;
        }

        .nav-links li a:hover {
            border-bottom-color: var(--accent);
            color: var(--accent);
        }

        .nav-cta {
            background: var(--accent);
            color: var(--primary) !important;
            padding: 12px 24px;
            border: var(--border-width) solid var(--secondary);
            font-size: 1.2rem !important;
            box-shadow: 4px 4px 0 var(--secondary);
        }

        .nav-cta:hover {
            background: var(--secondary) !important;
            color: var(--primary) !important;
            border-color: var(--accent);
            box-shadow: 4px 4px 0 var(--accent);
        }

        /* Hamburger - only visible on mobile */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 8px;
        }

        .hamburger span {
            display: block;
            width: 32px;
            height: 4px;
            background: var(--secondary);
            transition: all 0.3s ease;
        }

        /* ----- Hero Section ----- */
        .hero {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow: hidden;
            background: var(--primary);
            padding: var(--section-padding);
            margin-bottom: var(--section-gap);
            border-bottom: var(--border-width) solid var(--accent);
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 60%;
            height: 140%;
            background: repeating-linear-gradient(45deg, transparent 0px, transparent 20px, rgba(255,59,0,0.08) 20px, rgba(255,59,0,0.08) 21px);
            z-index: 0;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 80%;
        }

        .hero h1 {
            margin-bottom: 24px;
            text-shadow: 4px 4px 0 var(--accent);
            color: var(--secondary);
            font-size: clamp(4rem, 15vw, 10rem);
        }

        .hero h1 .accent {
            color: var(--accent);
            display: block;
            margin-top: -0.1em;
        }

        .hero-sub {
            font-size: 1.8rem;
            color: var(--secondary);
            background: var(--primary);
            padding: 16px 24px;
            border: var(--border-width) solid var(--accent);
            display: inline-block;
            margin-bottom: 48px;
            box-shadow: 6px 6px 0 var(--accent);
            transform: rotate(-2deg);
        }

        .hero-cta {
            display: inline-block;
            background: var(--accent);
            color: var(--primary) !important;
            font-size: 2rem;
            padding: 20px 48px;
            border: var(--border-width) solid var(--secondary);
            box-shadow: 8px 8px 0 var(--secondary);
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.2s;
        }

        .hero-cta:hover {
            background: var(--secondary);
            color: var(--primary) !important;
            box-shadow: 8px 8px 0 var(--accent);
            transform: translate(-4px, -4px);
        }

        .hero-badge {
            margin-top: 32px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .hero-badge span {
            background: var(--primary);
            border: 2px solid var(--secondary);
            padding: 8px 16px;
            font-size: 1rem;
            color: var(--secondary);
        }

        /* ----- Sections ----- */
        .section-title {
            margin-bottom: 48px;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 100%;
            height: var(--border-width);
            background: var(--accent);
            margin-top: 8px;
        }

        /* Features */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: var(--gap);
        }

        .feature-card {
            background: var(--primary);
            border: var(--border-width) solid var(--secondary);
            padding: 48px 32px;
            box-shadow: 6px 6px 0 var(--accent);
            transition: all 0.2s;
            position: relative;
        }

        .feature-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0 var(--accent);
        }

        .feature-card .icon {
            font-size: 4rem;
            margin-bottom: 24px;
        }

        .feature-card h3 {
            color: var(--accent);
            margin-bottom: 16px;
        }

        .feature-card p {
            color: var(--secondary);
            font-size: 1.1rem;
        }

        /* Reviews */
        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--gap);
        }

        .review-card {
            background: var(--primary);
            border: var(--border-width) solid var(--secondary);
            padding: 40px 32px;
            box-shadow: 8px 8px 0 var(--accent);
            transform: rotate(var(--rot, 0deg));
            transition: all 0.2s;
        }

        .review-card:nth-child(odd) {
            --rot: -2deg;
        }

        .review-card:nth-child(even) {
            --rot: 1deg;
        }

        .review-card:hover {
            transform: rotate(0deg) translate(-4px, -4px);
            box-shadow: 12px 12px 0 var(--accent);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .review-nickname {
            font-size: 1.6rem;
            color: var(--accent);
        }

        .review-date {
            font-size: 0.9rem;
            color: #888;
        }

        .review-stars {
            color: var(--accent);
            font-size: 1.6rem;
            letter-spacing: 4px;
        }

        .review-text {
            font-size: 1.1rem;
            line-height: 1.4;
        }

        /* CTA Section */
        .cta-section {
            background: var(--accent);
            padding: var(--section-padding) 0;
            margin-bottom: var(--section-gap);
            border-top: var(--border-width) solid var(--secondary);
            border-bottom: var(--border-width) solid var(--secondary);
            text-align: center;
        }

        .cta-section h2 {
            color: var(--primary);
            font-size: clamp(2.5rem, 6vw, 5rem);
            margin-bottom: 32px;
        }

        .cta-section .cta-button {
            display: inline-block;
            background: var(--primary);
            color: var(--secondary) !important;
            font-size: 2rem;
            padding: 20px 48px;
            border: var(--border-width) solid var(--secondary);
            box-shadow: 8px 8px 0 var(--secondary);
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.2s;
        }

        .cta-section .cta-button:hover {
            background: var(--secondary);
            color: var(--primary) !important;
            box-shadow: 8px 8px 0 var(--primary);
            transform: translate(-4px, -4px);
        }

        /* ----- Footer ----- */
        footer {
            background: var(--primary);
            border-top: var(--border-width) solid var(--accent);
            padding: var(--section-padding) 0 48px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--gap);
            margin-bottom: 48px;
        }

        .footer-col h4 {
            color: var(--accent);
            font-size: 1.6rem;
            margin-bottom: 24px;
        }

        .footer-col p, .footer-col a {
            color: var(--secondary);
            font-size: 1rem;
            display: block;
            margin-bottom: 8px;
        }

        .footer-col a {
            border-bottom: 1px solid transparent;
        }

        .footer-col a:hover {
            border-bottom-color: var(--accent);
        }

        .footer-copyright {
            text-align: center;
            border-top: 2px solid #333;
            padding-top: 32px;
            color: #888;
            font-size: 0.9rem;
        }

        /* ----- Responsive (Mobile) ----- */
        @media (max-width: 768px) {
            :root {
                --section-padding: 32px;
                --gap: 32px;
                --section-gap: 80px;
            }

            header {
                padding: 16px var(--section-padding);
            }

            .logo {
                font-size: 1.8rem;
            }

            .hamburger {
                display: flex;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--primary);
                flex-direction: column;
                padding: 24px var(--section-padding);
                border-bottom: var(--border-width) solid var(--accent);
                gap: 16px;
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links li a {
                font-size: 1.2rem;
            }

            .hero {
                min-height: 70vh;
                padding: var(--section-padding);
            }

            .hero-content {
                max-width: 100%;
            }

            .hero h1 {
                font-size: clamp(2.8rem, 12vw, 4.5rem);
                text-shadow: 3px 3px 0 var(--accent);
            }

            .hero-sub {
                font-size: 1.2rem;
                padding: 12px 16px;
            }

            .hero-cta {
                font-size: 1.4rem;
                padding: 16px 32px;
            }

            .hero-badge {
                gap: 12px;
            }

            .features-grid {
                grid-template-columns: 1fr;
            }

            .reviews-grid {
                grid-template-columns: 1fr;
            }

            .review-card {
                transform: none !important;
            }

            .cta-section .cta-button {
                font-size: 1.4rem;
                padding: 16px 32px;
            }

            .footer-grid {
                grid-template-columns: 1fr 1fr;
                gap: 32px;
            }
        }

        @media (max-width: 480px) {
            .footer-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Mobile menu toggle JS will be handled by simple script */
        .menu-open .nav-links {
            display: flex !important;
        }
    </style>
